# Codemagic 流水线 — PlayToStar（实况起点）iOS
# 本文件须位于 Codemagic 项目根目录。
# 首次使用前，只需做两件事（详见同包《iOS构建说明_FIRST.txt》）：
#   1) Codemagic → Team settings → Developer Portal → Manage keys，上传 App Store Connect API Key(.p8)
#   2) 把下面 integrations.app_store_connect 的值改成你给该 Key 起的名字（默认写的是 codemagic）

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2          # Apple 芯片 M2，个人免费额度可用

    # 引用在 Codemagic UI 里连接的 App Store Connect / Developer Portal 集成
    integrations:
      app_store_connect: CODEMAGICPLAYTOSTAR      # ← 若你的 Key 不叫这个名字，改成实际名称

    environment:
      node: 22            # @capacitor/cli 8.x 要求 Node >=22；且需 typescript 读取 capacitor.config.ts
      ios_signing:
        distribution_type: app_store   # 上架 / TestFlight 分发
        bundle_identifier: com.playtostar.app
        # 签名只需上面两个字段：Codemagic 会自动匹配已上传、且类型与 Bundle ID 相符的
        # 证书和描述文件。Apple Developer Portal 集成（CODEMAGICPLAYTOSTAR）在网页
        # UI 里关联即可，【不能写进 yaml】——ios_signing 下没有 certs_repository 字段，
        # 写了会报 “extra fields not permitted”，导致整个配置校验失败、无法启动构建。

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync web assets (www -> iOS)
        script: npx cap sync ios

      # cap sync 只把 npm 插件写进 packageClassList；本地微信插件需手动补注册，
      # 否则运行时报 “"WechatAuth" plugin is not implemented on ios”。
      - name: Register local native plugins (WechatAuth)
        script: python3 "$CM_BUILD_DIR/register_local_plugins.py"

      - name: Apply code signing settings
        script: xcode-project use-profiles

      # CFBundleVersion（构建号）每次上传都必须高于 ASC 上已有的最高值，否则发布报
      # “attribute ... already been used / bundle version must be higher”。
      # Codemagic 自己的 BUILD_NUMBER 目前只有十几、不能直接用；这里：
      #   默认 29；以后同一个版本每次重传，在 Start new build 的变量里设
      #   IOS_BUILD_NO=28、29…（逐次 +1），无需重新打包。
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          BN=${IOS_BUILD_NO:-29}
          agvtool new-version -all "$BN"
          echo "本次 CFBundleVersion = $BN（ASC 已上传最高为 26）"

      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
          RC=$?
          # 失败时自动从 Codemagic CLI 留存的 xcodebuild 日志里提取真正的错误行，
          # 直接打印到本步骤日志末尾，免去手动展开/下载 artifacts 查找。
          if [ $RC -ne 0 ]; then
            echo "========== 自动提取：真正的错误行 =========="
            shopt -s nullglob
            for f in /tmp/xcodebuild_logs/*.log; do
              echo "----- $f -----"
              grep -nE "error:|fatal error:|ld: |duplicate symbol|library not found|framework not found|CodeSign|errSec|no profiles|doesn't match|The following build commands failed|Unable to|requires a provisioning|Undefined symbol" "$f" | head -80
            done
            echo "========== 若上面为空，请展开本步骤完整日志搜索 error: =========="
            exit $RC
          fi

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # 第一次先只上传、不自动提交外部测试合规；等 Apple 处理后在 TestFlight
        # 把自己加为“内部测试”即可。需要外部测试时再改为 true 并指定 beta_groups。
        submit_to_testflight: false
        # submit_to_testflight: true
        # beta_groups:
        #   - External Testers
