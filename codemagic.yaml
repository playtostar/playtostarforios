# Codemagic 流水线 — PlayToStar（实况起点）iOS
# 本文件须位于 Codemagic 项目根目录。
workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2          # Apple 芯片 M2，个人免费额度可用
    environment:
      node: 22
      ios_signing:
        distribution_type: app_store   # 上架 / TestFlight 分发
        bundle_identifier: com.playtostar.app
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync web assets (www -> iOS)
        script: npx cap sync ios
      - name: Apply code signing settings
        script: xcode-project use-profiles
      # 用 Codemagic 每次构建自动递增的 BUILD_NUMBER 作为 CFBundleVersion，
      # 保证每次上传构建号唯一（无需手动改、无需 Apple ID 反查）。
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM