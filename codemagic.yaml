# Codemagic 流水线 — PlayToStar iOS
# 本文件须位于 Codemagic 项目根目录。
# 首次使用前，只需做两件事（详见同包《iOS构建说明_FIRST.txt》）：
#   1) Codemagic → Team settings → Developer Portal → Manage keys，上传 App Store Connect API Key(.p8)
#   2) integrations.app_store_connect 已填实际 Key 名：CODEMAGICPLAYTOSTAR（2026-10-20 用户确认）

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2          # Apple 芯片 M2，个人免费额度可用

    # 引用在 Codemagic UI 里连接的 App Store Connect / Developer Portal 集成
    integrations:
      app_store_connect: CODEMAGICPLAYTOSTAR      # ← Key 名（2026-10-20 用户确认，勿改）

    environment:
      node: 22            # @capacitor/cli 8.x 要求 Node >=22；且需 typescript 读取 capacitor.config.ts
      ios_signing:
        distribution_type: app_store   # 上架 / TestFlight 分发
        bundle_identifier: com.playtostar.app
        # 签名只需上面两个字段：Codemagic 会自动匹配已上传、且类型与 Bundle ID 相符的
        # 证书和描述文件。Apple Developer Portal 集成（CODEMAGICPLAYTOSTAR）在网页
        # UI 里关联即可，【不能写进 yaml】——ios_signing 下没有 certs_repository 字段，
        # 写了会报 “extra fields not permitted”，导致整个配置校验失败、无法启动构建。

    scripts:
      - name: Install npm dependencies
        script: npm ci

      # web 产物来源（自适应两种仓库布局）：
      #  A) 独立 iOS 出包仓库（如 github.com/playtostar/playtostarforios，仓库根
      #     即 mobile 内容、已带预构建 www、无 app/ 源码）：直接使用仓库里的 www；
      #  B) 含前端源码的大仓库（有 app/、无 www）：定位 app/ 现场 vite 构建。
      - name: Build web assets (vite -> mobile/www)
        script: |
          set -e
          MOBILE_DIR=""
          if [ -f "$CM_BUILD_DIR/package.json" ] && [ -d "$CM_BUILD_DIR/ios/App" ]; then
            MOBILE_DIR="$CM_BUILD_DIR"
          elif [ -d "$CM_BUILD_DIR/mobile/ios/App" ]; then
            MOBILE_DIR="$CM_BUILD_DIR/mobile"
          fi
          if [ -z "$MOBILE_DIR" ]; then echo "未找到 mobile 工程目录"; exit 1; fi
          # A) 已带预构建 www → 直接用，跳过构建
          if [ -f "$MOBILE_DIR/www/index.html" ]; then
            echo ">> 仓库已包含预构建 www，跳过前端构建：$MOBILE_DIR/www"
            ls "$MOBILE_DIR/www/assets" | grep -E 'index-.*\.js$' || true
            exit 0
          fi
          # B) 无 www → 查找 app/ 前端源码现场构建
          APP_DIR=""
          for cand in "$MOBILE_DIR/../app" "$MOBILE_DIR/../../app"; do
            p="$(cd "$cand" 2>/dev/null && pwd || true)"
            if [ -n "$p" ] && [ -f "$p/package.json" ] && [ -f "$p/vite.config.ts" ]; then APP_DIR="$p"; break; fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "既没有预构建 www，也未找到 app/ 前端源码，无法生成 web 产物"; exit 1
          fi
          echo ">> MOBILE_DIR=$MOBILE_DIR APP_DIR=$APP_DIR，从源码构建"
          cd "$APP_DIR"
          npm ci
          VITE_ENABLE_I18N=1 VITE_BASE=./ NODE_ENV=production \
            npx vite build --config vite.config.ts --outDir "$MOBILE_DIR/www" --emptyOutDir
          cd "$MOBILE_DIR"

      - name: Sync web assets (www -> iOS)
        script: |
          set -e
          # 防御：无论走 A 还是 B 路径，进 cap sync 前先把 www 里的 .map 清干净。
          # cap sync 会把 webDir 整个复制到 ios/App/App/public，任何残留的
          # sourcemap 都会原样打进 .ipa（明文源码 + 体积膨胀）。
          # A 路径下 www 由本仓库提供，理论上已无 .map（打包脚本会剔），这里是兜底；
          # B 路径下现场 vite build，预设默认 sourcemap:'hidden' 会产出 15MB 级 map，
          # 而 vite build 的 --emptyOutDir 只清空产物目录，不清我们后加的文件，故必须显式删。
          MOBILE_DIR=""
          if [ -f "$CM_BUILD_DIR/package.json" ] && [ -d "$CM_BUILD_DIR/ios/App" ]; then
            MOBILE_DIR="$CM_BUILD_DIR"
          elif [ -d "$CM_BUILD_DIR/mobile/ios/App" ]; then
            MOBILE_DIR="$CM_BUILD_DIR/mobile"
          fi
          if [ -n "$MOBILE_DIR" ] && [ -d "$MOBILE_DIR/www" ]; then
            MAPS=$(find "$MOBILE_DIR/www" -name "*.map" -type f 2>/dev/null | wc -l | tr -d ' ')
            if [ "$MAPS" != "0" ]; then
              echo ">> 发现 $MAPS 个 sourcemap，删除后再 cap sync"
              find "$MOBILE_DIR/www" -name "*.map" -type f -delete
            else
              echo ">> www 内无 sourcemap，直接 cap sync"
            fi
          fi
          npx cap sync ios

      # cap sync 只把 npm 插件写进 packageClassList；本地微信插件需手动补注册，
      # 否则运行时报 “"WechatAuth" plugin is not implemented on ios”。
      - name: Register local native plugins (WechatAuth)
        script: python3 "$CM_BUILD_DIR/register_local_plugins.py"

      - name: Apply code signing settings
        script: xcode-project use-profiles

      # CFBundleVersion（构建号）每次上传都必须高于 ASC 上已有的最高值，否则发布报
      # “attribute ... already been used / bundle version must be higher”。
      # Codemagic 自己的 BUILD_NUMBER 目前只有十几、不能直接用；这里：
      #   默认 49（2026-10-29 起：42/43 被 1.666、1.6665 两次拒审占用，44 跳过，
      #   45 早间推送占用，46 由 12:40 那次推送占用，47 由 13:50 那次推送占用 ——
      #   该轮之后又发现「网页形态产物误进包」（index.html 23 处商标词），
      #   48 在用户本机覆盖解压时被搞乱跳号，故本轮用 49。
      #   Apple 只要求递增、不允许复用，跳号无副作用）。
      #   以后同一个版本每次重传，在 Start new build 的变量里设
      #   IOS_BUILD_NO=50、51…（逐次 +1），无需重新打包。
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          BN=${IOS_BUILD_NO:-49}
          agvtool new-version -all "$BN"
          echo "本次 CFBundleVersion = $BN（默认 49；47 及以下均已被占用，下次重传设 50+）"

      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          set +e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
          RC=$?
          # 失败时自动从 Codemagic CLI 留存的 xcodebuild 日志里提取真正的错误行，
          # 直接打印到本步骤日志末尾，免去手动展开/下载 artifacts 查找。
          if [ $RC -ne 0 ]; then
            echo "========== 自动提取：真正的错误行 =========="
            shopt -s nullglob
            for f in /tmp/xcodebuild_logs/*.log; do
              echo "----- $f -----"
              grep -nE "error:|fatal error:|ld: |duplicate symbol|library not found|framework not found|CodeSign|errSec|no profiles|doesn't match|The following build commands failed|Unable to|requires a provisioning|Undefined symbol" "$f" | head -80
            done
            echo "========== 若上面为空，请展开本步骤完整日志搜索 error: =========="
            exit $RC
          fi

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # 第一次先只上传、不自动提交外部测试合规；等 Apple 处理后在 TestFlight
        # 把自己加为“内部测试”即可。需要外部测试时再改为 true 并指定 beta_groups。
        submit_to_testflight: false
        # submit_to_testflight: true
        # beta_groups:
        #   - External Testers
